<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KikiSms - Customer Account</title>
<style>
body{font-family:Arial,sans-serif;background:#071b49;margin:0;padding:25px 15px;color:#172554}
.card{max-width:400px;margin:30px auto;background:white;padding:25px;border-radius:15px}
h1{text-align:center;color:#0969da}
p{text-align:center;color:#64748b}
label{display:block;margin-top:15px;font-weight:bold}
input{width:100%;padding:12px;margin-top:7px;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:13px;margin-top:20px;background:#0969da;color:white;border:0;border-radius:7px;font-weight:bold}
.link{text-align:center;margin-top:20px}
a{color:#0969da}
#message{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>KikiSms</h1>
<p>Create an account or sign in to continue.</p>

<form id="signup">
<label>Your name</label>
<input id="name" required maxlength="100" placeholder="Enter your name">

<label>Email address</label>
<input id="email" type="email" required placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" minlength="8" required placeholder="At least 6 characters">

<button type="submit">Create Account</button>
</form>

<div class="link">
<a href="#" id="switch">Already registered? Sign in</a>
</div>
<p id="message"></p>
<div class="link"><a href="./index.html">Back to homepage</a></div>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL = 'https://iqdjrycrqzpbnxjqgpcr.supabase.co
const SUPABASE_KEY = 'sb_publishable_WdRQmrpzjWZx3nUMQW-v1Q_1TrQWZvH;

const form = document.getElementById('signup');
const nameInput = document.getElementById('name');
const passwordInput = document.getElementById('password');
const message = document.getElementById('message');
const switchLink = document.getElementById('switch');
let mode = 'signup';
let db = null;

if (SUPABASE_URL.startsWith('https://') && SUPABASE_KEY.startsWith('sb_publishable_')) {
  db = createClient(SUPABASE_URL, SUPABASE_KEY);
} else {
  message.textContent = 'Setup needed: add your Supabase project URL and publishable key in the code.';
}

switchLink.onclick = function(e) {
  e.preventDefault();
  mode = mode === 'signup' ? 'login' : 'signup';
  nameInput.parentElement.style.display = mode === 'signup' ? 'block' : 'none';
  nameInput.required = mode === 'signup';
  form.querySelector('button').textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
  switchLink.textContent = mode === 'signup' ? 'Already registered? Sign in' : 'Need an account? Sign up';
  message.textContent = '';
};

form.onsubmit = async function(e) {
  e.preventDefault();
  if (!db) {
    message.textContent = 'Supabase is not connected yet. Add your project URL and publishable key.';
    return;
  }

  const email = document.getElementById('email').value.trim();
  const password = passwordInput.value;
  const button = form.querySelector('button');
  button.disabled = true;
  message.textContent = 'Please wait...';

  try {
    if (mode === 'signup') {
      const {data, error} = await db.auth.signUp({
        email, password,
        options: {data: {full_name: nameInput.value.trim()}}
      });
      if (error) throw error;
      message.textContent = data.session
        ? 'Account created successfully!'
        : 'Registration submitted. Check your email to confirm your account.';
    } else {
      const {error} = await db.auth.signInWithPassword({email, password});
      if (error) throw error;
      message.textContent = 'Login successful!';
    }
  } catch (err) {
    message.textContent = err.message || 'Something went wrong. Please try again.';
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
  </html>
